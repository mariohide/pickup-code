name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Prepare Release Artifacts
        id: prepare
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/pickup-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/pickup-latest.apk"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pickup-release-apk
          path: release-artifacts/pickup-v${{ steps.prepare.outputs.VERSION }}.apk

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.prepare.outputs.VERSION }}"
          
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            TITLE="Release $TAG_NAME"
            echo "Publishing release for tag $TAG_NAME"
            gh release create "$TAG_NAME" \
              "release-artifacts/pickup-v${VERSION}.apk" \
              --title "$TITLE" \
              --generate-notes
          else
            TAG_NAME="latest"
            TITLE="Latest Build (v${VERSION} - ${GITHUB_SHA:0:7})"
            echo "Updating latest release on main push"
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release delete "$TAG_NAME" --yes --cleanup-tag || true
            fi
            gh release create "$TAG_NAME" \
              "release-artifacts/pickup-latest.apk" \
              "release-artifacts/pickup-v${VERSION}.apk" \
              --title "$TITLE" \
              --notes "Automated release build from commit ${GITHUB_SHA}." \
              --prerelease
          fi
