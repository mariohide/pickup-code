name: Release

# 只在发版时运行：打 tag 发正式版；手动触发则把所选分支构建为预发布的 latest
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

# 默认只读，只有发版任务需要写 Release
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # v6 起缓存由闭源组件提供，升级即接受 Gradle 使用条款；公开仓库目前免费
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

  publish-release:
    name: Build & Publish Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 缺任何一项就失败：否则 Gradle 退回 debug 签名，而 CI 每次的 debug 密钥都不同，装过的手机无法覆盖更新
      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少发版签名密钥 ${name}，不发布 debug 签名的包"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > app/pickup-release.jks

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: pickup-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare Release Artifacts
        id: prepare
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/pickup-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/pickup-latest.apk"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pickup-release-apk
          path: release-artifacts/pickup-v${{ steps.prepare.outputs.VERSION }}.apk

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.prepare.outputs.VERSION }}"
          
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            TITLE="Release $TAG_NAME"
            echo "Publishing release for tag $TAG_NAME"
            gh release create "$TAG_NAME" \
              "release-artifacts/pickup-v${VERSION}.apk" \
              --title "$TITLE" \
              --generate-notes
          else
            TAG_NAME="latest"
            TITLE="Latest Build (v${VERSION} - ${GITHUB_SHA:0:7})"
            echo "Updating latest prerelease from manual run on ${{ github.ref_name }}"
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release delete "$TAG_NAME" --yes --cleanup-tag || true
            fi
            gh release create "$TAG_NAME" \
              "release-artifacts/pickup-latest.apk" \
              "release-artifacts/pickup-v${VERSION}.apk" \
              --title "$TITLE" \
              --notes "Automated release build from commit ${GITHUB_SHA}." \
              --prerelease
          fi
